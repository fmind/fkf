version: 2
project_name: fkf
builds:
  - main: ./cmd/fkf
    binary: fkf
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # .Version, not .Tag: a snapshot resolves to <tag>-SNAPSHOT-<sha>, so an untagged build
    # never reports itself as the release, in `fkf --version` or in the archive name below.
    ldflags: -s -w -X github.com/fmind/fkf/core.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
# Each archive is one attestable install unit: binary, license, usage, and linked-dependency notices.
archives:
  - name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &archive-file-info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *archive-file-info
      - src: THIRD_PARTY_NOTICES.md
        info: *archive-file-info
checksum:
  name_template: checksums.txt
release:
  # CD publishes only after attesting every draft asset.
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
