    enabled: false
    layer: index
    requires: [gcloud-auth-ready.sh, gcloud-projects-json.sh, gcloud, jq]
    auth: [gcloud-auth-ready.sh]
    # Limit-plus-one makes an account beyond the reviewed 10,000-project envelope fail rather
    # than publish a complete-looking truncated snapshot.
    run: [gcloud-projects-json.sh]
    fields:
