  # --- Google Cloud: the gcloud CLI owns the login ----------------------------------------

  gcloud-audit-logs:
    enabled: false
    layer: events
    requires: [gcloud-auth-ready.sh, gcloud-audit-json.py, python3, gcloud]
    auth: [gcloud-auth-ready.sh]
    # Scope is the active project only. One overflow record distinguishes a complete bounded
    # day from silent provider truncation; request and response bodies never enter the output.
    run: [gcloud-audit-json.py, "{{start}}", "{{end}}"]
    fields:
      id: .uid
      time: .timestamp
      title: .protoPayload.methodName
      participant: [".protoPayload.authenticationInfo.principal_uri"]
    install: mise use -g gcloud@latest python@latest

