sources:
  # --- No credential needed: these read files already on this machine ----------------------
  git-commits: # your commits/rebases across every clone under one root, by committer time
    enabled: true
    layer: events # events = one document per day under events/; index = one document under index/
    requires: [git-log-json.py, python3, git]
    # window: true because the scan is the whole cost — reading N days one at a time repeats
    # the same directory walk N times for the same handful of commits. One call, bucketed by
    # each commit's own committer time, gives an identical result for a fraction of the wall
    # clock; `git-log-json.py` already accepts an arbitrary range, so nothing about it changes.
    window: true
    # The script is written into <base>/bin by init and is yours after that. The third argument
    # is where your clones live. It defaults to your home directory because that is the one
    # root that exists on every machine — `{{home}}/repositories` was a guess, and on a machine
    # without that directory the very first `fkf sync` a reader runs failed every day of it.
    # The helper walks each declared root completely, with no depth cap. A whole home directory
    # can be large or contain mounted trees, so narrow this to the directories that hold clones
    # before the first sync; use a colon-separated list when there are several. fkf passes each
    # path placeholder as one argument, so spaces or shell syntax in a home directory stay
    # path data rather than changing this command.
    #   run: [git-log-json.py, "{{start}}", "{{end}}", "{{home}}/src:{{home}}/work"]
    # Append every identity you commit under — a work address, GitHub's noreply one. Without
    # the list only `git config user.email` is selected, so a commit made under a
    # repository-local identity is silently never collected:
    #   run: [git-log-json.py, "{{start}}", "{{end}}", "{{home}}", me@work.test, 123+me@users.noreply.github.com]
    run: [git-log-json.py, "{{start}}", "{{end}}", "{{home}}"]
    # git-log-json.py emits and de-duplicates <repo>@<hash>: a hash alone repeats when the same
    # commit is present in two clones, while a record URI must name exactly one record.
    fields:
      id: .uid # field paths are a jq subset: .a.b[0]; anything richer goes in the command
      time: .time
      title: .message
      repo: .repo_full
      repository: .repository_uri
      participant: [".participant_uris[]"]

  shell-commands: # metadata about shell activity from atuin, never the command text
    # Requires atuin and its database at the path below. Raw shell commands routinely contain
    # inline tokens, passwords, signed URLs, and heredoc data. The helper reads them only in a
    # private temporary directory to classify an allowlisted tool and verb; it emits no argument
    # text. The record also keeps when and where a command ran, its exit status, and duration.
    enabled: false
    layer: events
    requires: [atuin-history-json.py, python3]
    # window: true — one read-only SQLite scan for a year of history costs about what one costs
    # for a day; {{start}}/{{end}} are timestamps the Python standard library accepts.
    window: true
    # The helper opens SQLite read-only, excludes deleted rows, and parses each command in a
    # private Python process before emitting the bounded metadata projection.
    run: [atuin-history-json.py, "{{start}}", "{{end}}", "{{home}}/.local/share/atuin/history.db"]
    fields:
      id: .id
      time: .time
      title: .subject
    install: mise use -g python@latest # and atuin itself: mise use -g atuin@latest

  agent-sessions: # one record per coding-agent session per day, from the transcripts on disk
    # On by default: the Python helper reads what Claude Code, Codex, Gemini CLI, OpenCode,
    # Copilot, Antigravity, and Grok keep on disk; a harness that is not installed contributes
    # nothing, and what an agent did in a repository is the half of your work no
    # provider can see. Metadata only — id, time, harness, cwd, branch, the clone's repository,
    # the harness's own title line — never a prompt or a response; subagent threads are skipped.
    # Add a reader to bin/agent-sessions.py for another harness.
    enabled: true
    layer: events
    requires: [agent-sessions.py, python3, git]
    # Deliberately not windowed: one exact-day run proves a timestamped turn/message belongs to
    # that day. A multi-day session envelope cannot honestly be bucketed into its idle days.
    run: [
      agent-sessions.py,
      "{{start}}",
      "{{end}}",
    ] # script written into bin/ by init; Python plus git
    fields:
      id: .id
      time: .time
      title: .title
      repo: .repo
      repository: .repository_uri
    install: mise use -g python@latest

  agent-memory-files: # one record per harness memory file touched that day
    # Claude Code's auto-memory, Codex's memories, Gemini CLI's per-project memory, and Grok's
    # Markdown memory are where an agent's decisions land today:
    # per tool, per project, unversioned, invisible to the other harnesses and to fkf. This
    # source lists the files touched each day — path, time, title from a bounded prefix, never body — so
    # the fkf-learn skill can read them as candidates and promote the durable ones into wiki/.
    enabled: true
    layer: events
    requires: [agent-memory-files.py, agent-memory-body.py, python3]
    window: true # one walk across every harness root instead of one per requested day
    run: [agent-memory-files.py, "{{start}}", "{{end}}"]
    body: [agent-memory-body.py, "{{id}}"]
    bodies: sync
    fields:
      id: .id
      time: .time
      title: .title
    install: mise use -g python@latest

  agent-prompts: # metadata for requests you wrote; full text remains lazy behind body:
    enabled: false
    layer: events
    requires: [agent-prompts.py, agent-prompt-body.py, python3, git]
    window: true
    run: [agent-prompts.py, "{{start}}", "{{end}}", "0"]
    timeout: 5m
    fields:
      id: .id
      time: .time
      title: .title
      repo: .repo
    body: [agent-prompt-body.py, "{{id}}"]
    install: mise use -g python@latest

  agent-session-traces: # bounded transcript evidence from the shared harness-independent store
    # One completed session becomes an ordinary event record. Requests and the last assistant
    # message remain untrusted values; git contributes changed paths only, never file contents.
    enabled: true
    layer: events
    requires: [agent-session-trace.py, python3, git]
    window: true
    run: [agent-session-trace.py, "{{start}}", "{{end}}"]
    timeout: 10m
    fields:
      id: .id
      time: .time
      title: .title
      repo: .repo
      repository: .repository_uri
    install: mise use -g python@latest

  chrome-bookmarks: # a current metadata snapshot across Chromium-family profiles
    enabled: false
    layer: index
    max_age_hours: 24 # bookmark inventory changes slowly; daily refresh avoids hourly browser reads
    requires: [chrome-bookmarks.py, python3]
    run: [chrome-bookmarks.py]
    fields:
      id: .uid
      title: .title
      url: .url
    install: mise use -g python@latest

  mise-tools: # active local tool versions; no provider or network call
    enabled: false
    layer: index
    requires: [mise-tools-json.sh, mise, jq]
    run: [mise-tools-json.sh]
    fields:
      id: .id
      title: .title

  repository-facts:
    # Replace this root before enabling. The helper inspects only immediate Git repositories
    # and bounded metadata; it never runs Git hooks, package scripts, mise, or repository code.
    enabled: false
    layer: index
    max_age_hours: 24
    requires: [repository-facts.py, python3]
    run: [repository-facts.py, "{{home}}/REPLACE_WITH_REPOSITORIES"]
    test: [repository-facts.py, --version]
    fields:
      id: .id
      title: .title
      repository: .repository_uri
      configured_root: .root_ref
      remote: [".remotes[]"]
      language: [".languages[]"]
      declared_task: [".declared_tasks[].command"]
      instruction: [".instructions[]"]
      proof: .proof
    install: mise use -g python@latest

  writing-documents: # edit the sentinel to one or more explicit authored files before enabling
    enabled: false
    layer: index
    requires: [writing-source-json.sh, writing-index.py, python3, git, yq]
    run: [writing-source-json.sh, "{{home}}/REPLACE_WITH_WRITING_DOCUMENT.md"]
    fields:
      id: .id
      title: .title
      url: .url
      repo: .repo
    install: mise use -g python@latest yq@latest

  # Create <base>/feeds.opml from your reader's OPML export before enabling this: `fkf init`
  # writes no feed list, and a public OPML that does not exist is a hard collection failure.
  rss-items: # feeds expose a complete current document, not historical pages
    enabled: false
    layer: index
    requires: [rss-json.py, python3, curl]
    run: [rss-json.py, "{{base}}/feeds.opml", --optional-opml, "{{base}}/feeds.private.opml"]
    timeout: 10m
    fields:
      id: .id
      time: .time
      title: .title
      url: .url
      visibility: .visibility
    install: mise use -g python@latest

  chromium-pages: # local browser-history metadata; disabled until the owner opts in
    enabled: false
    layer: events
    requires: [chromium-pages.py, python3]
    # One SQLite online backup covers the requested span, including committed live-WAL rows. The helper
    # strips URL credentials, query strings, and fragments before any JSON reaches fkf.
    window: true
    run: [chromium-pages.py, "{{start}}", "{{end}}"]
    fields:
      id: .uid
      time: .time
      title: .title
      url: .url
    install: mise use -g python@latest

  # --- GitHub: the gh CLI owns the login --------------------------------------------------

  github-pull-requests:
    enabled: false
    layer: events
    requires: [github-search-json.py, python3, gh]
    auth: [gh, auth, status]
    # One helper call covers the requested range. GitHub Search exposes at most 1,000 results
    # per query, so github-search-json.py recursively splits a saturated half-open time window,
    # uses an inclusive end one second before each boundary, de-duplicates canonical URLs, and
    # fails if even a one-second slice saturates. A complete day can never look truncated.
    window: true
    run: [github-search-json.py, prs, assignee, "{{start}}", "{{end}}"]
    # Issue and pull-request numbers are repository-scoped; the canonical URL is globally unique.
    # gh pr view accepts that URL directly, so {{id}} still fetches the body without parsing it.
    fields:
      id: .url
      time: .updatedAt
      title: .title
      url: .url
      repo: .repository.nameWithOwner
      repository: .repository_uri
      owner: [".assignee_uris[]"]
      participant: [".participant_uris[]"]
    body: [gh, pr, view, "{{id}}", --repo, "{{repo}}", --json, "body,comments"] # argv, one record, on demand
    install: mise use -g gh@latest python@latest
    # A saturated range can cost several search requests. Retry only GitHub's explicit search
    # limit responses; any other provider or completeness error remains a hard failure.
    retry:
      attempts: 3
      backoff: 30s
      on: ["API rate limit exceeded", "secondary rate limit"]

  github-issues:
    enabled: false
    layer: events
    requires: [github-search-json.py, python3, gh]
    auth: [gh, auth, status]
    window: true # see github-pull-requests: the helper proves every range is complete
    run: [github-search-json.py, issues, assignee, "{{start}}", "{{end}}"]
    # Issue numbers are repository-scoped; gh issue view accepts the globally unique URL.
    fields:
      id: .url
      time: .updatedAt
      title: .title
      url: .url
      repo: .repository.nameWithOwner
      repository: .repository_uri
      owner: [".assignee_uris[]"]
      participant: [".participant_uris[]"]
    body: [gh, issue, view, "{{id}}", --repo, "{{repo}}", --json, "body,comments"]
    install: mise use -g gh@latest python@latest
    retry:
      attempts: 3
      backoff: 30s
      on: ["API rate limit exceeded", "secondary rate limit"]

  github-reviews:
    enabled: false
    layer: events
    requires: [github-reviews-json.py, python3, gh]
    auth: [gh, auth, status]
    # Contributions are review events, not pull requests that merely match reviewed-by. The
    # helper follows at most 100 GraphQL pages, checks totalCount, and enforces the half-open window.
    window: true
    run: [github-reviews-json.py, "{{start}}", "{{end}}"]
    # The id is a stable REST API locator, so the review body remains available only on demand.
    fields:
      id: .id
      time: .submittedAt
      title: .title
      url: .url
      repo: .repo
      repository: .repository_uri
      participant: [".participant_uris[]"]
    body: [gh, api, "{{id}}"]
    install: mise use -g gh@latest python@latest
    retry:
      attempts: 3
      backoff: 30s
      on: ["API rate limit exceeded", "secondary rate limit"]

  github-notifications:
    enabled: false
    layer: events
    requires: [github-list-json.py, python3, gh]
    auth: [gh, auth, status]
    format: ndjson
    # The helper follows Link rel=next within a finite ceiling, reapplies the exact half-open
    # updated_at window, and emits only reviewed notification and repository metadata.
    run: [github-list-json.py, notifications, "{{start}}", "{{end}}"]
    fields:
      id: .id
      time: .updated_at
      title: .subject.title
      url: .subject.url
      repo: .repository.full_name
      repository: .repository_uri
    install: mise use -g gh@latest python@latest

  github-repositories:
    enabled: false
    layer: index # a point-in-time snapshot, refreshed on age rather than per day
    max_age_hours: 24 # repository inventory is useful daily, not on every hourly schedule tick
    requires: [github-list-json.py, python3, gh]
    auth: [gh, auth, status]
    # The authenticated-user endpoint covers repositories you own, collaborate on, or can read
    # through an organization. The helper follows Link headers within a reviewed finite budget.
    format: ndjson
    run: [github-list-json.py, user-repositories]
    fields:
      id: .nameWithOwner
      title: .title
      url: .url
      repo: .nameWithOwner
      repository: .repository_uri
    install: mise use -g gh@latest python@latest

  github-commits:
    enabled: false
    layer: events
    requires: [github-commits-json.py, python3, gh]
    auth: [gh, auth, status]
    window: true
    run: [github-commits-json.py, "{{start}}", "{{end}}"]
    timeout: 8m
    fields:
      id: .url
      time: .commit.author.date
      title: .title
      url: .url
      repo: .repository.fullName
      repository: .repository_uri
      participant: [".participant_uris[]"]
    retry:
      attempts: 3
      backoff: 30s
      on: ["API rate limit exceeded", "secondary rate limit"]
    install: mise use -g gh@latest python@latest

  github-events:
    enabled: false
    layer: events
    requires: [github-events-json.py, python3, gh]
    auth: [gh, auth, status]
    run: [github-events-json.py, "{{start}}", "{{end}}"]
    timeout: 5m
    fields:
      id: .id
      time: .created_at
      title: .title
      repo: .repo
      repository: .repository_uri
      participant: [".participant_uris[]"]
    install: mise use -g gh@latest python@latest

  github-runs:
    enabled: false
    layer: events
    requires: [gh-runs.py, github-generic-list-json.py, python3, gh]
    auth: [gh, auth, status]
    window: true
    # No owner argument means the authenticated user's owned repositories. Add explicit
    # organizations locally when those calls and their larger timeout are intentional.
    run: [gh-runs.py, "{{start}}", "{{end}}"]
    timeout: 10m
    fields:
      id: .url
      time: .createdAt
      title: .displayTitle
      url: .url
      repo: .repo
      repository: .repository_uri
    install: mise use -g gh@latest python@latest

  github-stars:
    enabled: false
    layer: index
    requires: [github-stars-json.sh, github-generic-list-json.py, python3, gh, jq]
    auth: [gh, auth, status]
    format: ndjson
    run: [github-stars-json.sh]
    fields:
      id: .full_name
      title: .title
      url: .url
      repo: .full_name
      repository: .repository_uri
    install: mise use -g gh@latest jq@latest python@latest

  github-gists:
    enabled: false
    layer: index
    requires: [github-gists-json.sh, github-generic-list-json.py, python3, gh, jq]
    auth: [gh, auth, status]
    format: ndjson
    run: [github-gists-json.sh]
    fields:
      id: .id
      title: .description
      url: .url
    install: mise use -g gh@latest jq@latest python@latest

  # --- Google Workspace: the gws CLI owns the OAuth flow ----------------------------------

  # A replaceable point-in-time agenda supplies today's brief without making an incomplete
  # event day mutable. Historical calendar evidence remains in google-calendar-events.
  google-calendar-agenda:
    enabled: false
    layer: index
    max_age_hours: 1 # today's agenda drives scheduled briefs and must stay current within the hour
    requires: [gws-calendars-json.py, gws-page-json.py, python3, gws]
    auth: [gws, auth, status]
    run: [gws-calendars-json.py, "{{start}}", "{{end}}", "{{date}}", "{{next_date}}"]
    timeout: 5m
    fields:
      id: .uid
      time: .at
      title: .summary
      url: .htmlLink
      visibility: .visibility
      participant: [".participant_uris[]"]
      attachment: [".attachment_uris[]"]
    install: mise use -g github:googleworkspace/cli@latest python@latest

  google-calendar-events:
    enabled: false
    layer: events
    requires: [gws-calendar-body.py, gws-calendars-json.py, gws-page-json.py, python3, gws]
    auth: [gws, auth, status]
    window: true
    # Walk every visible calendar with finite, token-validated pagination, then filter event
    # starts to the exact half-open window and project metadata only.
    run: [gws-calendars-json.py, "{{start}}", "{{end}}", "{{date}}", "{{next_date}}"]
    timeout: 5m
    fields:
      id: .uid
      time: .at
      title: .summary
      url: .htmlLink
      visibility: .visibility
      participant: [".participant_uris[]"]
      attachment: [".attachment_uris[]"]
    body: [gws-calendar-body.py, "{{id}}"]
    install: mise use -g github:googleworkspace/cli@latest python@latest

  meeting-notes:
    enabled: false
    layer: events
    requires: [gws-meeting-notes-json.py, gws-calendars-json.py, gws-page-json.py, gws-doc-text.sh, python3, gws, jq]
    auth: [gws, auth, status]
    window: true
    # Enable and sync google-calendar-events too. The helper refuses a matched note until the
    # calendar record it links is durable, so timeline never depends on an ephemeral live join.
    # Replace the sentinel with the stable prefix used for owner-authored notes. Gemini's
    # conventional " - Notes by Gemini" suffix is always included as the other branch.
    run: [
      gws-meeting-notes-json.py,
      "{{start}}",
      "{{end}}",
      "{{date}}",
      "{{next_date}}",
      REPLACE_WITH_MEETING_PREFIX,
      "{{base}}",
    ]
    body: [gws-doc-text.sh, "{{id}}"]
    bodies: sync
    timeout: 10m
    fields:
      id: .id
      time: .at
      title: .title
      modified: .modified
      url: .url
      owner: [".owner_uris[]"]
      attachment: [".attachment_uris[]"]
      meeting: [".meeting_uris[]"]
    install: mise use -g github:googleworkspace/cli@latest jq@latest python@latest

  google-calendars:
    enabled: false
    layer: index
    requires: [gws-page-json.py, python3, gws, jq]
    auth: [gws, auth, status]
    format: ndjson
    records: .items
    run: [
      gws-page-json.py,
      items,
      gws,
      calendar,
      calendarList,
      list,
      --params,
      '{"maxResults":250,"fields":"nextPageToken,items(id,summary,description,location,timeZone,accessRole,primary,selected,hidden,colorId,backgroundColor,foregroundColor)"}',
      --page-all,
      --page-limit,
      "100",
    ]
    fields:
      id: .id
      title: .summary
    install: mise use -g github:googleworkspace/cli@latest jq@latest python@latest

  google-gmail-emails: # metadata only by default; the body is lazy and never enters stored evidence
    enabled: false
    layer: events
    requires: [gmail-body.py, gmail-json.py, gws-page-json.py, python3, gws]
    auth: [gws, auth, status]
    format: ndjson
    # The helper converts exact RFC3339 bounds to epoch seconds, widens Gmail's exclusive
    # after: operator by one second, then filters internalDate to the exact half-open window.
    # Fallible stages are separate, so no provider/conversion failure disappears in a pipeline.
    run: [gmail-json.py, "{{start}}", "{{end}}"]
    timeout: 15m
    # from_entries, not `.headers[]|select(...)`: constructing an object from an EMPTY stream
    # yields no object at all, so every message with no Subject — bounces, most automated
    # notifications, many invites — silently vanished with no error and no count to notice.
    # The To/Cc split matters just as much: a raw `a@x, b@y` header became ONE identity, so a
    # mail to three people coined a junk person node and a junk graph edge for the trio.
    fields:
      id: .id
      time: .internalDate
      title: .subject
      participant: [".participant_uris[]"]
    body: [gmail-body.py, "{{id}}"]
    install: mise use -g github:googleworkspace/cli@latest python@latest

  google-chat-spaces:
    enabled: false
    layer: index # spaces list has no time window, so this is one current snapshot
    requires: [gws-page-json.py, python3, gws, jq]
    auth: [gws, auth, status]
    format: ndjson
    records: .spaces
    run: [
      gws-page-json.py,
      spaces,
      gws,
      chat,
      spaces,
      list,
      --params,
      '{"pageSize":100}',
      --page-all,
      --page-limit,
      "100",
    ]
    fields:
      id: .name
      time: .lastActiveTime
      title: .name
      url: .spaceUri
    install: mise use -g github:googleworkspace/cli@latest jq@latest python@latest

  google-chat-messages:
    enabled: false
    layer: events
    requires: [gws-chat-messages.py, gws-chat-message-body.py, gws-page-json.py, python3, gws]
    auth: [gws, auth, status]
    window: true
    run: [gws-chat-messages.py, "{{start}}", "{{end}}"]
    timeout: 10m
    fields:
      id: .name
      time: .createTime
      title: .title
    body: [gws-chat-message-body.py, "{{id}}"]
    install: mise use -g github:googleworkspace/cli@latest python@latest

  google-tasks-items:
    enabled: false
    layer: events
    requires: [gws-tasks.py, gws-page-json.py, python3, gws]
    auth: [gws, auth, status]
    # One helper walks every task list, proves each finite token chain, and applies the missing
    # upper time bound before emitting a globally unique list-and-task identity.
    window: true
    run: [gws-tasks.py, "{{start}}", "{{end}}"]
    timeout: 5m
    fields:
      id: .uid
      time: .updated
      title: .title
      url: .webViewLink
    install: mise use -g github:googleworkspace/cli@latest python@latest

  google-drive-files:
    # `fields` MUST name nextPageToken or --page-all has no token to follow and silently files
    # the provider's first page as the whole account, with no error and a document that looks
    # complete. The extra fields are free: one request returns them, and every collected field
    # is greppable by `fkf find --where`.
    enabled: false
    layer: index
    max_age_hours: 24 # the complete Drive inventory is intentionally a daily snapshot
    requires: [gws-page-json.py, python3, gws, jq]
    auth: [gws, auth, status]
    format: ndjson
    records: .files
    run: [
      gws-page-json.py,
      files,
      gws,
      drive,
      files,
      list,
      --params,
      '{"q":"trashed=false","pageSize":1000,"orderBy":"modifiedTime desc","fields":"nextPageToken,files(id,name,mimeType,webViewLink,modifiedTime,createdTime,size,owners(emailAddress,displayName),shared,trashed,parents)"}',
      --page-all,
      --page-limit,
      "100",
    ]
    # The helper repeats this contract as a local output projection, so a provider-added field
    # cannot enter the base even when the remote field mask is ignored or widened.
    fields:
      id: .id
      url: .webViewLink
      title: .name
      # Drive's owners[] is ownership, not generic involvement. The root schema separates
      # `owner` from `participant`, and the role name is what becomes the graph edge kind.
      owner: [".owners[].uri"]
    install: mise use -g github:googleworkspace/cli@latest jq@latest python@latest

  google-docs:
    enabled: false
    layer: index
    requires: [gws-page-json.py, python3, gws, jq]
    auth: [gws, auth, status]
    format: ndjson
    records: .files
    run: [
      gws-page-json.py,
      files,
      gws,
      drive,
      files,
      list,
      --params,
      '{"q":"mimeType=''application/vnd.google-apps.document'' and trashed=false","pageSize":1000,"orderBy":"modifiedTime desc","fields":"nextPageToken,files(id,name,mimeType,webViewLink,createdTime,modifiedTime,size,shared,trashed,owners(emailAddress,displayName))"}',
      --page-all,
